name: Build PS4 Package Link Android APK
on:
  push:
    branches: [android-build-2026-10-08]
    paths:
      - 'android-build-src.b64'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Expand Kotlin project
        run: |
          base64 --decode android-build-src.b64 | tar -xJf -
          ls -l app/build.gradle.kts
      - name: Compile and run unit tests
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PS4PackageLink-Android-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
