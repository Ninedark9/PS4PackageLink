name: Build PS4 Package Link Android APK
on:
  push:
    branches: [android-build-2026-10-08]
    paths:
      - 'android-build-src.b64'
      - 'android-catalog-patch-v0.2.b64'
      - 'android-catalog-patch-v0.3.b64'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -35
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Expand Kotlin project
        run: |
          base64 --decode android-build-src.b64 | tar -xJf -
          ls -l app/build.gradle.kts
      - name: Add Games Library metadata-only catalog
        run: |
          base64 --decode android-catalog-patch-v0.2.b64 | tar -xJf -
          python3 patch_android_v02.py
          grep 'versionName' app/build.gradle.kts
      - name: Enable full online search v0.3.0
        run: |
          base64 --decode android-catalog-patch-v0.3.b64 | tar -xJf -
          grep -F 'versionName = "0.3.0"' app/build.gradle.kts
          grep -F 'fun search(rawQuery: String, page: Int)' app/src/main/java/dev/ninedark/ps4packagelink/catalog/GameCatalog.kt
      - name: Compile and run unit tests
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PS4PackageLink-Android-v0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
