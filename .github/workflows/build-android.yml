name: Build Android APK v0.2.1
on:
  push:
    branches: [android-build-v0.2.1]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android-build.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack Android sources
        run: |
          base64 -d android-build.b64 > /tmp/source.zip
          mkdir -p android-project
          unzip -q /tmp/source.zip -d android-project
      - name: Assemble debug APK
        working-directory: android-project
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PS4PackageLink-Android-v0.2.1
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
