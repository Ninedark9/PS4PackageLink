name: Build Android APK v0.5.4
on:
  push:
    branches: [android-build-v0.5.4]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android-build.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fLsS --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-commandlinetools.zip
            unzip -q /tmp/android-commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack Android sources
        run: |
          base64 -d android-build.b64 > /tmp/source.zip
          mkdir -p android-project
          unzip -q /tmp/source.zip -d android-project
      - name: Verify JavaScript browser extractor syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path('android-project/app/src/main/java/dev/ninedark/ps4packagelink/catalog/BrowserLinkCapture.kt')
          text=p.read_text()
          match=re.search(r'const val javascript = """(.*?)"""',text,re.S)
          assert match,'Browser JavaScript not found'
          pathlib.Path('/tmp/host_discovery.js').write_text(match.group(1))
          PY
          node --check /tmp/host_discovery.js
      - name: Assemble debug APK
        working-directory: android-project
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PS4PackageLink-Android-v0.5.4
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
